<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belajar Menulis Abjad - Gamifikasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-Bhy1nOqU.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-LK8tdvHC.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Header Navigation -->
    <header class="top-header">
      <button class="btn btn-white home-btn">
        <span class="icon">🏠</span> Belajar Menulis
      </button>
      
      <div class="title-container">
        <div class="title-cloud">
          <span class="icon-pencil-title">✏️</span>
          <h1>Huruf <span id="ui-letter" class="highlight-blue">A</span></h1>
          <p>Ayo, ikuti garis putus-putus dan tulis huruf <span id="ui-letter-desc">A</span>!</p>
        </div>
      </div>

      <div class="right-header">
        <div class="star-badge">⭐ <span id="ui-score">1</span> / 10</div>
        <button class="btn btn-circle sound-btn">🔊</button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-layout">
      <!-- Sidebar Tools -->
      <aside class="sidebar">
        <button id="btn-pencil" class="tool-btn btn-yellow active">
          <div class="tool-icon">🖍️</div>
          <span>Tulis</span>
        </button>
        <!-- Tombol Hapus (Penghapus / Mode Putih) -->
        <button id="btn-eraser" class="tool-btn btn-purple">
          <div class="tool-icon">🧽</div>
          <span>Hapus</span>
        </button>
        <button id="btn-clear" class="tool-btn btn-green">
          <div class="tool-icon">🔄</div>
          <span>Ulangi</span>
        </button>
        
        <div class="character-mascot">👦</div>
      </aside>

      <!-- Center Work Area -->
      <main class="work-area">
        <div class="board">
          <!-- Top Reference Section -->
          <div class="reference-section">
            <div class="ref-box box-blue">
               <div id="ui-svg-container" class="ref-letters">
                 <!-- Animasi Tracing Huruf A menggunakan SVG -->
                 <svg class="tracing-animation" viewBox="0 0 150 100" width="100%" height="80px">
                   <path class="guide-path" d="M 50 10 L 20 90 M 50 10 L 80 90 M 35 60 L 65 60" />
                   <path class="guide-path" d="M 125 45 A 20 20 0 1 0 125 85 M 125 45 L 125 85" />
                   <path class="trace-path" d="M 50 10 L 20 90 M 50 10 L 80 90 M 35 60 L 65 60" />
                   <path class="trace-path-small" d="M 125 45 A 20 20 0 1 0 125 85 M 125 45 L 125 85" />
                 </svg>
               </div>
            </div>
            <div class="ref-box box-yellow">
               <div class="ref-illustration">
                 <span id="ui-emoji" class="avocado-icon">🥑</span>
                 <h2 id="ui-word" class="word-blue">Alpukat</h2>
               </div>
            </div>
          </div>

          <!-- Bottom Canvas Section (Buku Tulis) -->
          <div class="canvas-section">
            <!-- Canvas ini memiliki background garis buku tulis via CSS -->
            <canvas id="drawing-canvas" width="800" height="400"></canvas>
          </div>
        </div>
      </main>
    </div>

    <!-- Footer Navigation -->
    <footer class="bottom-footer">
      <button id="btn-prev" class="btn btn-white back-btn" style="visibility: hidden;">⬅️ Sebelumnya</button>
      <!-- Feedback Message -->
      <div id="feedback-message">Selamat belajar!</div>
      <button id="btn-next" class="btn btn-blue next-btn">Lanjut ➡️</button>
    </footer>
  </div>

</body>
</html>
