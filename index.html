<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belajar Menulis Abjad - Gamifikasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-Y-2TiIKk.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BK6ZIlOn.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Header Navigation -->
    <header class="top-header">
      <button class="btn btn-white home-btn">
        <span class="icon">🏠</span> Belajar Menulis
      </button>
      
      <div class="title-container">
        <div class="title-cloud">
          <span class="icon-pencil-title">✏️</span>
          <h1>Huruf <span id="ui-letter" class="highlight-blue">A</span></h1>
          <p>Ayo, ikuti garis putus-putus dan tulis huruf <span id="ui-letter-desc">A</span>!</p>
        </div>
      </div>

      <div class="right-header">
        <div class="star-badge">⭐ <span id="ui-score">1</span> / 10</div>
        <button id="btn-sound" class="btn btn-circle sound-btn" title="Musik Latar (Putar / Hening)">🔊</button>
      </div>
    </header>

    <!-- Audio Background Music (100% Free Copyright / Public Domain) -->
    <audio id="bgm-audio" loop preload="auto">
      <source src="./bgm.wav" type="audio/wav">
    </audio>

    <!-- Main Content (Layar Penuh untuk Kanvas Menulis) -->
    <main class="work-area">
      <!-- Compact Action & Reference Bar -->
      <div class="top-action-bar">
        <div class="ref-group">
          <div class="ref-box box-blue compact-svg-box">
             <div id="ui-svg-container" class="ref-letters">
               <!-- SVG Tracing Animasi -->
             </div>
          </div>
          <div class="ref-box box-yellow compact-word-box">
             <div class="ref-illustration">
               <span id="ui-emoji" class="avocado-icon">🥑</span>
               <h2 id="ui-word" class="word-blue">Alpukat</h2>
             </div>
          </div>
        </div>

        <!-- Tool Buttons Horizontal di Atas Kanvas -->
        <div class="tools-group">
          <button id="btn-pencil" class="tool-btn btn-yellow active">
            <span class="tool-icon">🖍️</span>
            <span>Tulis</span>
          </button>
          <button id="btn-eraser" class="tool-btn btn-purple">
            <span class="tool-icon">🧽</span>
            <span>Hapus</span>
          </button>
          <button id="btn-clear" class="tool-btn btn-green">
            <span class="tool-icon">🔄</span>
            <span>Ulangi</span>
          </button>
        </div>
      </div>

      <!-- Canvas Section (Lebar Maksimal & Bersih) -->
      <div class="canvas-section">
        <canvas id="drawing-canvas"></canvas>
      </div>
    </main>

    <!-- Footer Navigation -->
    <footer class="bottom-footer">
      <div class="footer-left">
        <span class="character-mascot-footer">👦</span>
        <button id="btn-prev" class="btn btn-white back-btn" style="visibility: hidden;">⬅️ Sebelumnya</button>
      </div>
      <!-- Feedback Message -->
      <div id="feedback-message">Selamat belajar!</div>
      <button id="btn-next" class="btn btn-blue next-btn">Lanjut ➡️</button>
    </footer>
  </div>

</body>
</html>
